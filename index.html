<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>益田川 鮎ルアーガイド</title>
<meta name="description" content="益田川流域の鮎ルアーポイントを地図で紹介。ポイントごとの写真・アクセス方法・駐車場やトイレの情報も掲載しています。">

<!-- SNS・LINEなどでシェアされた際の表示（OGP） -->
<meta property="og:type" content="website">
<meta property="og:title" content="益田川 鮎ルアーガイド">
<meta property="og:description" content="益田川流域の鮎ルアーポイントを地図で紹介。ポイントごとの写真・アクセス方法・駐車場やトイレの情報も掲載しています。">
<meta property="og:url" content="https://mashitariver-ayulureguide.github.io/ayulure-map/">
<meta property="og:image" content="https://mashitariver-ayulureguide.github.io/ayulure-map/kyowabashi.jpg">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --river-deep:   #1f4a52;
    --river-mid:    #3d7a82;
    --stone:        #eae6da;
    --stone-dark:   #cfc9b6;
    --moss:         #52683f;
    --ayu-orange:   #d97b3f;
    --ink:          #24302c;
    --paper:        #f7f5ee;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Noto Sans JP',sans-serif;}

  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:480px;}

  header{
    background:linear-gradient(120deg,var(--river-deep),var(--river-mid));
    color:var(--paper);
    padding:18px 24px 16px;
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
    border-bottom:4px solid var(--ayu-orange);
  }
  header h1{
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:.04em;
  }
  header h1 a{
    color:inherit;
    text-decoration:none;
  }
  header h1 a:hover{ opacity:.85; }
  header .sub{
    font-size:15px;
    opacity:.9;
    letter-spacing:.06em;
    color:var(--paper);
    text-decoration:underline;
    text-underline-offset:3px;
  }
  header .sub:hover{ opacity:1; }

  .layout{flex:1;display:flex;min-height:0;}
  #map{flex:1;min-width:0;min-height:320px;}

  .panel{
    width:340px;
    flex-shrink:0;
    background:var(--paper);
    border-left:1px solid var(--stone-dark);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  .panel::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:0;
    height:28px;
    background:linear-gradient(to bottom, rgba(247,245,238,0), var(--paper) 85%);
    pointer-events:none;
  }
  .panel-head{
    flex-shrink:0;
    padding:20px 18px 14px;
    border-bottom:1px solid var(--stone-dark);
  }
  .panel-head h2{
    font-family:'Shippori Mincho',serif;
    font-size:26px;
    font-weight:700;
    letter-spacing:.03em;
    margin:0;
    color:var(--river-deep);
  }
  .sheet-handle,
  .sheet-chevron{ display:none; }

  .spot-list{list-style:none;margin:0;padding:8px;padding-bottom:28px;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .spot-item{
    display:flex;
    gap:10px;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s ease, border-color .15s ease;
    align-items:center;
  }
  .spot-item:hover{background:var(--stone);}
  .spot-item.active{
    background:#fff;
    border-color:var(--ayu-orange);
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .spot-badge{
    width:26px;height:26px;border-radius:50%;
    background:var(--river-deep);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;flex-shrink:0;
  }
  .spot-item.active .spot-badge{background:var(--ayu-orange);}
  .spot-text .name{font-size:14px;font-weight:700;line-height:1.5;}

  .leaflet-popup-content-wrapper{
    border-radius:10px;
    font-family:'Noto Sans JP',sans-serif;
  }
  .popup-title{font-weight:700;font-size:14px;margin:0 0 5px;}
  .popup-body{font-size:13px;line-height:1.7;margin:0;color:var(--ink);}
  .popup-tags{margin-top:7px;font-size:12px;font-weight:700;color:var(--river-deep);}
  .popup-links{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
  }
  .popup-pdf-link,
  .popup-maps-link,
  .popup-home-link{
    display:inline-block;
    padding:7px 11px;
    font-size:12px;
    font-weight:700;
    text-decoration:none;
    border-radius:5px;
    white-space:nowrap;
  }
  .popup-pdf-link{
    background:var(--ayu-orange);
    color:#fff !important;
  }
  .popup-maps-link{
    background:var(--river-mid);
    color:#fff !important;
  }
  .popup-home-link{
    background:transparent;
    color:var(--river-deep) !important;
    border:1px solid var(--stone-dark);
  }
  .popup-pdf-link:hover,
  .popup-maps-link:hover,
  .popup-home-link:hover{ opacity:.8; }
  .popup-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:10px;
    padding-top:9px;
    border-top:1px solid var(--stone-dark);
  }
  .popup-nav-btn{
    font-family:'Noto Sans JP',sans-serif;
    font-size:12px;
    font-weight:700;
    color:var(--river-deep);
    background:var(--stone);
    border:none;
    border-radius:5px;
    padding:6px 12px;
    cursor:pointer;
  }
  .popup-nav-btn:active{ background:var(--stone-dark); }
  .popup-nav-count{
    font-size:11px;
    color:var(--river-deep);
    font-weight:700;
  }
  .popup-image{
    display:block;
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:6px;
    margin:-4px -4px 8px;
    width:calc(100% + 8px);
  }

  @media (max-width:760px){
    .layout{position:relative;min-height:0;}
    #map{position:absolute;inset:0;height:100%;width:100%;}

    .panel{
      position:absolute;
      left:0; right:0; bottom:0;
      width:100%;
      height:72vh;
      max-height:72vh;
      min-height:0;
      border-left:none;
      border-top:none;
      border-radius:16px 16px 0 0;
      box-shadow:0 -6px 20px rgba(0,0,0,.18);
      transform:translateY(calc(100% - 54px));
      transition:transform .32s ease;
      z-index:500;
    }
    .panel.sheet-open{
      transform:translateY(0);
    }

    .panel-head{
      position:relative;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:16px 18px 12px;
    }
    .sheet-handle{
      display:block;
      position:absolute;
      top:7px; left:50%;
      transform:translateX(-50%);
      width:36px; height:4px;
      border-radius:2px;
      background:var(--stone-dark);
    }
    .panel-head h2{ font-size:18px; }
    .sheet-chevron{
      display:inline-block;
      font-size:11px;
      color:var(--river-mid);
      transition:transform .32s ease;
    }
    .panel.sheet-open .sheet-chevron{ transform:rotate(180deg); }

    .popup-image{height:70px;}
    .popup-title{font-size:13px;}
    .popup-body{font-size:12px;line-height:1.6;}
    .popup-tags{font-size:11px;margin-top:5px;}
    .popup-links{gap:5px;margin-top:6px;}
    .popup-nav{margin-top:7px;padding-top:7px;}
    .popup-nav-btn{font-size:11px;padding:5px 10px;}
    .popup-nav-count{font-size:10px;}
    .popup-pdf-link,
    .popup-maps-link,
    .popup-home-link{padding:5px 8px;font-size:10px;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1><a href="https://mashitariver-ayulureguide.github.io/ayulure-map/">益田川 鮎ルアーガイド</a></h1>
    <a class="sub" href="https://www.mashitagawa.jp/" target="_blank" rel="noopener noreferrer">益田川漁業協同組合</a>
  </header>

  <div class="layout">
    <div id="map"></div>

    <div class="panel" id="panel">
      <div class="panel-head" id="panelHead">
        <span class="sheet-handle" aria-hidden="true"></span>
        <h2 id="panelTitle">ポイント一覧</h2>
        <span class="sheet-chevron" aria-hidden="true">▲</span>
      </div>
      <ul class="spot-list" id="spotList"></ul>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===================== ポイントデータ =====================
   実運用では緯度経度をマイマップ上の実ピン位置に合わせてください。
   id は各QRコードのURLパラメータ ?point=id と対応します。 */
const SPOTS = [
  {
    id: "hanamomo",
    name: "小坂川（支流）道の駅はなもも前",
    river: "小坂川",
    lat: 35.9315092, lng: 137.2948095,
    image: "hanamomo.jpg",
    pdf: "hanamomo.pdf",
    desc: "御嶽の恵みに育まれた鮎を釣りに。道の駅からすぐ、トイレも食事処も近い安心感。",
    tags: "駐車場有・トイレ有・初心者向き"
  },
  {
    id: "kyowabashi",
    name: "大洞川（支流）共和橋",
    river: "大洞川",
    lat: 35.9215159, lng: 137.3091557,
    image: "kyowabashi.jpg",
    pdf: "kyowabashi.pdf",
    desc: "釣りも、川遊びも楽しめる。近隣にキャンプ場あり、川遊びできるスポットも点在。",
    tags: "舗装駐車場有・初心者向き"
  },
  {
    id: "lawson",
    name: "竹原川（支流）ローソン前",
    river: "竹原川",
    lat: 35.7653959, lng: 137.2870686,
    image: "lawson.jpg",
    pdf: "lawson.pdf",
    desc: "川で出会える、おいしい鮎。鮎の美味しさ・美しさの品評会「鮎グランプリ」の鮎が釣れる。",
    tags: "舗装駐車場有・コンビニ有・初心者向き"
  },
  {
    id: "yamayuubin",
    name: "山之口川（支流）郵便局前",
    river: "山之口川",
    lat: 35.9684801, lng: 137.1960171,
    image: "yamayuubin.jpg",
    pdf: "yamayuubin.pdf",
    desc: "静寂と透明度、山里の清流に浸る。抜群の透明度と豊かな自然、静かに川と向き合いたい人のためのフィールド。",
    tags: "駐車場有・トイレ有（車で2分）・初心者向き"
  },
  {
    id: "kumiaimae",
    name: "飛騨川　漁協事務所前",
    river: "飛騨川",
    lat: 35.8807575, lng: 137.2068935,
    image: "kumiaimae.jpg",
    pdf: "kumiaimae.pdf",
    desc: "本流の開放感、大鮎の舞台。飛騨川本流ならではの開放的な眺望。大型の鮎が期待できる。",
    tags: "舗装駐車場有・トイレ有・コンビニ有"
  },
  {
    id: "tanosiri",
    name: "門和佐川（支流）田之尻橋",
    river: "門和佐川",
    lat: 35.7131178, lng: 137.2077537,
    image: "tanosiri.jpg",
    pdf: "tanosiri.pdf",
    desc: "日本の原風景の中で、鮎を釣る。橋の上から覗くと、鮎が泳ぐ姿がはっきり見える透明度。",
    tags: "駐車場有・トイレ有（車で2分）・初心者向き"
  },
  {
    id: "sankoh",
    name: "門和佐川（支流）三光橋",
    river: "門和佐川",
    lat: 35.7155981, lng: 137.2068537,
    image: "sankoh.jpg",
    pdf: "sankoh.pdf",
    desc: "鮎ルアー向きの区間「三光橋」。駐車スペースは、橋の下流側に5台程度停めることが可能。",
    tags: "駐車場有・トイレ有（車で2分）・初心者向き"
  },
  {
    id: "wasaground",
    name: "門和佐川（支流）和佐グラウンド",
    river: "門和佐川",
    lat: 35.7180191, lng: 137.2048497,
    image: "wasaground.jpg",
    pdf: "wasaground.pdf",
    desc: "2025年に鮎ルアーイベントの会場にもなった。駐車スペース多数、公衆トイレもあり。",
    tags: "駐車場有・トイレ有・初心者向き"
  },
  {
    id: "yamaki",
    name: "門和佐川（支流）山喜建設（北）",
    river: "門和佐川",
    lat: 35.7201237, lng: 137.204829,
    image: "yamaki.jpg",
    pdf: "yamaki.pdf",
    desc: "競争率低め、穴場ポイント。駐車は未舗装部分のみ可。※舗装部分は私有地のため駐車禁止。",
    tags: "駐車場有・トイレ有（車で2分）・初心者向き"
  },
  {
    id: "kadowasagoryu",
    name: "門和佐川（支流）本流合流点",
    river: "門和佐川",
    lat: 35.7222683, lng: 137.2011067,
    image: "kadowasagoryu.jpg",
    pdf: "kadowasagoryu.pdf",
    desc: "門和佐川の最下流部。産卵を控えた鮎が居着くポイント。シーズン後半におすすめ。",
    tags: "駐車場有・トイレ有（車で3分）・初心者向き"
  },
  {
    id: "nakaharakoh",
    name: "飛騨川　中原公民館裏",
    river: "飛騨川",
    lat: 35.726036, lng: 137.1991328,
    image: "nakaharakoh.jpg",
    pdf: "nakaharakoh.pdf",
    desc: "終盤の大鮎釣りの人気ポイント。お盆には尺鮎が出た実績あり。シーズン後半にもおすすめ。",
    tags: "駐車場有・トイレ有（車で2分）"
  },
  {
    id: "nakaharahoiku",
    name: "飛騨川　旧中原保育園裏",
    river: "飛騨川",
    lat: 35.7289316, lng: 137.1973007,
    image: "nakaharahoiku.jpg",
    pdf: "nakaharahoiku.pdf",
    desc: "旧「中原保育園」の裏手。お盆には尺鮎が出た実績あり。終盤の大鮎釣りの人気ポイント。",
    tags: "駐車場有・トイレ有（車で3分）"
  }
];

/* ===================== 地図初期化 ===================== */
const map = L.map('map', { scrollWheelZoom: true }).setView([35.83, 137.22], 11);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom: 19
}).addTo(map);

/* 地図クレジット表示が、スマホのボトムシート（画面下の一覧バー）と
   重なってしまうため、常に重ならない位置（右上）に移動する */
map.attributionControl.setPosition('topright');

/* 地図（背景部分）をタップしたら、スマホのボトムシートを閉じる。
   ユーザーが一覧を開いたまま「地図の方を見たい」と思った時の
   分かりやすい閉じ方として機能する。 */
map.on('click', () => {
  panelEl.classList.remove('sheet-open');
});

/* コンテナのサイズ確定タイミングによって地図が「世界表示」になってしまう
   Leafletの既知の挙動を防ぐため、読み込み完了後とリサイズ時にサイズを再計算する */
function fixMapSize(){ map.invalidateSize(); }
window.addEventListener('load', fixMapSize);
window.addEventListener('resize', fixMapSize);
setTimeout(fixMapSize, 300);

/* ===================== 下呂市 境界線の表示 =====================
   国立情報学研究所「歴史的行政区域データセットβ版」が公開している
   下呂市単体のGeoJSON（2023年基準）を読み込み、点線の境界線として
   オーバーレイ表示する。 */
fetch('https://geoshape.ex.nii.ac.jp/city/geojson/20230101/21/21220A2004.geojson')
  .then(res => res.json())
  .then(geojson => {
    L.geoJSON(geojson, {
      style: {
        color: '#d97b3f',
        weight: 2,
        dashArray: '6 4',
        fill: false
      },
      interactive: false
    }).addTo(map);
  })
  .catch(() => {
    // 境界データが取得できなくても地図自体は通常通り表示させる
    console.warn('下呂市の境界データを読み込めませんでした。');
  });

function makeIcon(active, number){
  return L.divIcon({
    className: '',
    html: `<div style="
      width:28px;height:28px;border-radius:50% 50% 50% 0;
      background:${active ? '#d97b3f' : '#1f4a52'};
      transform:rotate(-45deg);
      border:2px solid #fff;
      box-shadow:0 1px 4px rgba(0,0,0,.35);
      display:flex;align-items:center;justify-content:center;
    "><span style="
      transform:rotate(45deg);
      color:#fff;font-weight:700;font-size:13px;
      font-family:'Noto Sans JP',sans-serif;
    ">${number}</span></div>`,
    iconSize: [28,28],
    iconAnchor: [14,28],
    popupAnchor: [0,-26]
  });
}

const BASE_URL = "https://mashitariver-ayulureguide.github.io/ayulure-map/";

const markers = {};
const spotNumberById = {};
SPOTS.forEach((spot, i) => {
  spotNumberById[spot.id] = i + 1;
  const marker = L.marker([spot.lat, spot.lng], { icon: makeIcon(false, i + 1) }).addTo(map);
  const imageHtml = spot.image
    ? `<img src="${spot.image}" alt="${spot.name}" class="popup-image">`
    : '';
  const pdfHtml = spot.pdf
    ? `<a href="${spot.pdf}" target="_blank" rel="noopener noreferrer" class="popup-pdf-link">詳しく見る（PDF）</a>`
    : '';
  const mapsFallbackUrl = `https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}&travelmode=driving`;
  const mapsHtml = `<a href="${mapsFallbackUrl}" target="_blank" rel="noopener noreferrer" class="popup-maps-link" data-lat="${spot.lat}" data-lng="${spot.lng}">現在地からのルート（Google）</a>`;
  const homeHtml = `<a href="${BASE_URL}" class="popup-home-link">全体図を見る</a>`;

  // 前後のポイントへ1タップで移動できるナビゲーション（末尾/先頭でループ）
  const prevSpot = SPOTS[(i - 1 + SPOTS.length) % SPOTS.length];
  const nextSpot = SPOTS[(i + 1) % SPOTS.length];
  const navHtml = SPOTS.length > 1
    ? `<div class="popup-nav">
         <button type="button" class="popup-nav-btn" data-goto="${prevSpot.id}">‹ 前</button>
         <span class="popup-nav-count">${i + 1} / ${SPOTS.length}</span>
         <button type="button" class="popup-nav-btn" data-goto="${nextSpot.id}">次 ›</button>
       </div>`
    : '';

  marker.bindPopup(
    `${imageHtml}
     <p class="popup-title">${spot.name}</p>
     <p class="popup-body">${spot.desc}</p>
     <p class="popup-tags">${spot.tags}</p>
     <div class="popup-links">${mapsHtml}${pdfHtml}${homeHtml}</div>
     ${navHtml}`,
    { maxWidth: 240, maxHeight: 340, autoPanPadding: [16, 16] }

  );
  marker.on('click', () => selectSpot(spot.id, false));
  markers[spot.id] = marker;
});

/* 吹き出し内「前 / 次」ボタン：隣のポイントへ移動する */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.popup-nav-btn');
  if(!btn) return;
  selectSpot(btn.dataset.goto, true);
});

/* 「現在地からのルート」ボタン：
   吹き出しを開いた時点で裏側で現在地を取得しておき（prefetchLocation）、
   ボタンをクリックした瞬間には既に分かっている現在地を使ってGoogleマップへ
   遷移する。

   iOSのSafari/Chromeでは、通常のGoogleマップWebリンク(https://www.google.com/maps/...)
   を新しいタブで開こうとすると、ブラウザによって挙動が割れてしまう
   （Safari:アプリを開く確認ダイアログ／Chrome:Google独自の「アプリで開く」宣伝ページ）。
   これを避けるため、iOSでは Google マップアプリの専用URL形式(comgooglemaps://)を
   直接呼び出す。アプリが入っていればブラウザの種類を問わず直接アプリへ切り替わり、
   入っていなければ一定時間後に通常のWeb版へフォールバックする。 */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

let cachedPosition = null;
let userMarker = null;
let userAccuracyCircle = null;

/* 取得した現在地を地図上に青い点として表示する。
   「今どこにいて、どのポイントが近いか」が一目で分かるようにする。 */
function showUserLocation(coords){
  const latlng = [coords.latitude, coords.longitude];
  if(userMarker){
    userMarker.setLatLng(latlng);
    userAccuracyCircle.setLatLng(latlng).setRadius(coords.accuracy || 0);
    return;
  }
  userAccuracyCircle = L.circle(latlng, {
    radius: coords.accuracy || 0,
    color: '#1a73e8',
    weight: 1,
    fillColor: '#1a73e8',
    fillOpacity: .12,
    interactive: false
  }).addTo(map);
  userMarker = L.marker(latlng, {
    icon: L.divIcon({
      className: '',
      html: `<div style="
        width:16px;height:16px;border-radius:50%;
        background:#1a73e8;border:3px solid #fff;
        box-shadow:0 0 0 1px rgba(0,0,0,.2), 0 1px 4px rgba(0,0,0,.35);
      "></div>`,
      iconSize: [16,16],
      iconAnchor: [8,8]
    }),
    interactive: false,
    keyboard: false
  }).addTo(map);
}

function prefetchLocation(){
  if(!navigator.geolocation) return;
  if(cachedPosition && userMarker) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      cachedPosition = pos.coords;
      showUserLocation(pos.coords);
    },
    () => { /* 取得できない場合は何もしない（クリック時にフォールバックURLを使う） */ },
    { enableHighAccuracy: false, timeout: 5000, maximumAge: 300000 }
  );
}

// ページを開いた時点で現在地の取得を試み、地図上に表示する
prefetchLocation();

document.addEventListener('click', (e) => {
  const link = e.target.closest('.popup-maps-link');
  if(!link) return;

  const destLat = link.dataset.lat;
  const destLng = link.dataset.lng;
  const originParam = cachedPosition ? `${cachedPosition.latitude},${cachedPosition.longitude}` : '';
  const webUrl = `https://www.google.com/maps/dir/?api=1${originParam ? '&origin=' + originParam : ''}&destination=${destLat},${destLng}&travelmode=driving`;

  if(!isIOS){
    // iOS以外（PC・Androidなど）は、これまで通り通常のWebリンクとして遷移
    link.href = webUrl;
    return;
  }

  // iOS：アプリへの直接切り替えを試み、切り替わらなければWeb版へフォールバック
  e.preventDefault();
  const appUrl = `comgooglemaps://?daddr=${destLat},${destLng}&directionsmode=driving`
    + (originParam ? `&saddr=${originParam}` : '');

  /* バックグラウンド中はタイマーの実行が一時停止されるため、
     「時間で判定する」方式だと、アプリから戻ってきた瞬間にタイマーが
     まとめて実行され、正常に切り替わっていたのに誤って
     フォールバックしてしまう不具合があった。
     そのため「画面が非表示になったイベント」が実際に発生したかどうかで
     判定し、発生していればフォールバック自体を取り消す方式に変更。 */
  let switchedAway = false;
  const onHide = () => {
    switchedAway = true;
    clearTimeout(fallbackTimer);
    document.removeEventListener('visibilitychange', onHide);
  };
  document.addEventListener('visibilitychange', onHide);

  // ページ本体から直接呼び出す。アプリへの切り替えに成功した場合、
  // ブラウザの表示内容は変わらないまま保たれる（iframe経由だと
  // Safariではセキュリティ上の理由でブロックされてしまうため、直接呼び出す）。
  window.location.href = appUrl;

  const fallbackTimer = setTimeout(() => {
    document.removeEventListener('visibilitychange', onHide);
    if(!switchedAway){
      // 切り替わっていない＝アプリ未インストールとみなし、Web版へ遷移
      window.location.href = webUrl;
    }
  }, 1200);
});

/* ===================== 右パネルのリスト生成 ===================== */
document.getElementById('panelTitle').textContent = `ポイント一覧（${SPOTS.length}）`;

const listEl = document.getElementById('spotList');
SPOTS.forEach((spot, i) => {
  const li = document.createElement('li');
  li.className = 'spot-item';
  li.dataset.id = spot.id;
  li.innerHTML = `
    <div class="spot-badge">${i+1}</div>
    <div class="spot-text">
      <div class="name">${spot.name}</div>
    </div>`;
  li.addEventListener('click', () => selectSpot(spot.id, true));
  listEl.appendChild(li);
});

/* ===================== ボトムシートの開閉（スマホ表示） ===================== */
const panelEl = document.getElementById('panel');
document.getElementById('panelHead').addEventListener('click', () => {
  panelEl.classList.toggle('sheet-open');
  // 開いたときは、選択中のポイントが画面内に見えるよう自動でスクロールする
  if(panelEl.classList.contains('sheet-open')){
    const activeItem = listEl.querySelector('.spot-item.active');
    if(activeItem){
      activeItem.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }
});

/* ===================== 選択状態の反映 ===================== */
function selectSpot(id, flyToIt){
  const spot = SPOTS.find(s => s.id === id);
  if(!spot) return;

  // ピンの見た目更新
  Object.entries(markers).forEach(([sid, m]) => {
    m.setIcon(makeIcon(sid === id, spotNumberById[sid]));
  });

  // リストのハイライト更新
  document.querySelectorAll('.spot-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  if(flyToIt){
    map.flyTo([spot.lat, spot.lng], 15, { duration: 0.8 });
  }
  markers[id].openPopup();
  prefetchLocation();

  // ポイントを選んだら、地図とピンが見えるようボトムシートを閉じる（スマホ表示）
  panelEl.classList.remove('sheet-open');

  // URLを書き換え（ブラウザ履歴を汚さないreplaceState）
  const url = new URL(window.location.href);
  url.searchParams.set('point', id);
  window.history.replaceState({}, '', url);
}

/* ===================== 初期表示：URLパラメータを読む ===================== */
const params = new URLSearchParams(window.location.search);
const initialId = params.get('point');

if(initialId && markers[initialId]){
  selectSpot(initialId, true);
} else {
  // パラメータが無ければ全体表示
  const bounds = L.latLngBounds(SPOTS.map(s => [s.lat, s.lng]));
  map.fitBounds(bounds.pad(0.2));
}
</script>
</body>
</html>
